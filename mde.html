<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>문서 뷰어</title>
  
  <!-- 구글 폰트 & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
  
  <!-- 마크다운 파서 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      /* 안드로이드 Material 3 라이트 테마 토큰 */
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-surface: #f8f9fa;
      --md-sys-color-surface-container: #f0f4f9;
      --md-sys-color-surface-container-high: #e9eef6;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #747775;
      --md-sys-color-outline-variant: #c4c7c5;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-surface-tint: #0b57d0;
      
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-extra-large: 28px;
      --md-shape-corner-full: 9999px;

      --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
      --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
      --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.3);
    }

    body.dark-mode {
      /* 안드로이드 Material 3 다크 테마 토큰 */
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-surface: #111318;
      --md-sys-color-surface-container: #1e2025;
      --md-sys-color-surface-container-high: #282a2f;
      --md-sys-color-on-surface: #e2e2e9;
      --md-sys-color-on-surface-variant: #c4c7c5;
      --md-sys-color-outline: #8e918f;
      --md-sys-color-outline-variant: #444746;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Noto Sans KR', 'Roboto', sans-serif;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.25s cubic-bezier(0.2, 0, 0, 1), color 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .material-symbols-rounded {
      font-size: 24px;
      user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* M3 아이콘 버튼 */
    .icon-btn {
      position: relative;
      overflow: hidden;
      background: none;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background-color: rgba(68, 71, 70, 0.08);
    }

    .icon-btn:active {
      background-color: rgba(68, 71, 70, 0.16);
    }

    /* --- M3 Top App Bar --- */
    .top-app-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(64px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: 8px;
      padding-right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--md-sys-color-surface);
      z-index: 50;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      transition: background-color 0.25s, border-color 0.25s;
    }

    .top-app-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: var(--md-sys-color-on-surface);
    }

    /* --- 메인 마크다운 뷰어 --- */
    .main-content {
      max-width: 840px;
      margin: 0 auto;
      padding: calc(80px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));
      line-height: 1.7;
    }

    .main-content h1, .main-content h2, .main-content h3 {
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin: 1.4em 0 0.6em;
    }

    .main-content p {
      margin-bottom: 1.2em;
      color: var(--md-sys-color-on-surface);
      font-size: 16px;
    }

    .main-content pre {
      background: var(--md-sys-color-surface-container-high);
      padding: 16px;
      border-radius: var(--md-shape-corner-large);
      overflow-x: auto;
      margin-bottom: 1.2em;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .main-content code {
      font-family: monospace;
      background: var(--md-sys-color-surface-container-high);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 14px;
    }

    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50vh;
      color: var(--md-sys-color-outline);
      gap: 12px;
      text-align: center;
    }

    /* --- M3 Floating Action Button (FAB) --- */
    .fab-container {
      position: fixed;
      bottom: calc(96px + env(safe-area-inset-bottom));
      right: 20px;
      z-index: 60;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 12px;
    }

    .fab {
      width: 56px;
      height: 56px;
      border-radius: var(--md-shape-corner-large);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: var(--md-elevation-3);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab .material-symbols-rounded {
      font-size: 28px;
    }

    /* --- M3 Navigation Bar (하단 탭) --- */
    .bottom-navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(80px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      transition: background-color 0.25s;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      flex: 1;
      height: 100%;
    }

    .nav-icon-container {
      width: 64px;
      height: 32px;
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      color: var(--md-sys-color-on-surface-variant);
    }

    .nav-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      letter-spacing: 0.1px;
    }

    .nav-item.active .nav-icon-container {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .nav-item.active .nav-icon-container .material-symbols-rounded {
      font-variation-settings: 'FILL' 1;
    }

    .nav-item.active .nav-label {
      color: var(--md-sys-color-on-surface);
      font-weight: 700;
    }

    /* --- M3 Modal Navigation Drawer (사이드 메뉴) --- */
    .drawer-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1), visibility 0.3s;
    }

    .drawer-scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .navigation-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 320px;
      max-width: 85vw;
      background-color: var(--md-sys-color-surface-container);
      border-radius: 0 var(--md-shape-corner-extra-large) var(--md-shape-corner-extra-large) 0;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: var(--md-elevation-2);
    }

    .navigation-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 24px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .drawer-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0 12px 12px;
    }

    /* 계층 트리 노드 */
    .tree-node {
      position: relative;
      display: flex;
      align-items: center;
      height: 48px;
      border-radius: var(--md-shape-corner-full);
      padding-right: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s;
    }

    .tree-node:hover {
      background-color: rgba(0, 0, 0, 0.04);
    }

    body.dark-mode .tree-node:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .tree-node.active-doc {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .tree-node.dragging {
      opacity: 0.4;
      background-color: var(--md-sys-color-surface-container-high);
    }

    .tree-node.drag-over {
      outline: 2px dashed var(--md-sys-color-primary);
      background-color: rgba(11, 87, 208, 0.08);
    }

    .node-arrow {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--md-shape-corner-full);
      flex-shrink: 0;
    }

    .node-icon {
      margin: 0 8px 0 2px;
      display: flex;
      align-items: center;
      color: inherit;
    }

    .node-title {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .root-drop-zone {
      margin: 12px;
      padding: 14px;
      border: 2px dashed var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-large);
      text-align: center;
      font-size: 13px;
      color: var(--md-sys-color-outline);
      display: none;
    }

    .root-drop-zone.active {
      display: block;
    }

    /* --- M3 Modal Bottom Sheet --- */
    .bottom-sheet-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .bottom-sheet-scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-corner-extra-large) var(--md-shape-corner-extra-large) 0 0;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      z-index: 160;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: var(--md-elevation-3);
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background-color: var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-full);
      margin: 14px auto 16px;
    }

    .sheet-header-title {
      font-size: 16px;
      font-weight: 700;
      padding: 0 12px 14px;
      color: var(--md-sys-color-on-surface);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 8px;
    }

    .sheet-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: none;
      border: none;
      border-radius: var(--md-shape-corner-full);
      font-size: 15px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
    }

    .sheet-item:active {
      background-color: rgba(0, 0, 0, 0.08);
    }

    body.dark-mode .sheet-item:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .sheet-item.danger {
      color: var(--md-sys-color-error);
    }

    /* --- M3 AlertDialog --- */
    .dialog-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      padding: 24px;
    }

    .dialog-scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .m3-dialog {
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-corner-extra-large);
      width: 100%;
      max-width: 320px;
      padding: 24px;
      box-shadow: var(--md-elevation-3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dialog-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }

    .dialog-content {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .m3-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--md-sys-color-outline);
      background: transparent;
      border-radius: var(--md-shape-corner-small);
      padding: 0 12px;
      color: var(--md-sys-color-on-surface);
      font-size: 15px;
      outline: none;
    }

    .m3-input:focus {
      border: 2px solid var(--md-sys-color-primary);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-text {
      background: none;
      border: none;
      padding: 10px 16px;
      border-radius: var(--md-shape-corner-full);
      font-size: 14px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      cursor: pointer;
    }

    .btn-text:active {
      background-color: rgba(11, 87, 208, 0.1);
    }

    /* --- 풀스크린 에디터 --- */
    .fullscreen-editor {
      position: fixed;
      inset: 0;
      background-color: var(--md-sys-color-surface);
      z-index: 300;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .fullscreen-editor.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .editor-top-bar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 4px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 10px 20px;
      border-radius: var(--md-shape-corner-full);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      gap: 16px;
    }

    .input-title {
      font-size: 22px;
      font-weight: 700;
      border: none;
      outline: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      padding: 8px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .textarea-content {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-size: 16px;
      line-height: 1.7;
      resize: none;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="top-app-bar-left">
      <button id="menuBtn" class="icon-btn" aria-label="메뉴">
        <span class="material-symbols-rounded">menu</span>
      </button>
      <span class="app-title">문서 뷰어</span>
    </div>
    <div style="display: flex; gap: 4px;">
      <button id="themeToggleBtn" class="icon-btn" aria-label="테마 전환">
        <span class="material-symbols-rounded" id="themeIcon">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- 메인 뷰어 -->
  <main id="mainContent" class="main-content"></main>

  <!-- M3 Floating Action Button -->
  <div class="fab-container">
    <button id="fabBtn" class="fab" aria-label="새 문서 추가">
      <span class="material-symbols-rounded">edit</span>
    </button>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-navigation">
    <button id="tabHome" class="nav-item active">
      <div class="nav-icon-container">
        <span class="material-symbols-rounded">article</span>
      </div>
      <span class="nav-label">문서</span>
    </button>
    <button id="tabExplore" class="nav-item">
      <div class="nav-icon-container">
        <span class="material-symbols-rounded">folder</span>
      </div>
      <span class="nav-label">탐색기</span>
    </button>
    <button id="tabCreate" class="nav-item">
      <div class="nav-icon-container">
        <span class="material-symbols-rounded">add_circle</span>
      </div>
      <span class="nav-label">작성</span>
    </button>
  </nav>

  <!-- Modal Navigation Drawer -->
  <div id="drawerScrim" class="drawer-scrim"></div>
  <aside id="navDrawer" class="navigation-drawer">
    <div class="drawer-header">
      <span class="drawer-title">폴더 및 문서</span>
      <div style="display: flex; gap: 4px;">
        <button id="addRootFolderBtn" class="icon-btn" title="새 폴더">
          <span class="material-symbols-rounded">create_new_folder</span>
        </button>
        <button id="closeDrawerBtn" class="icon-btn" title="닫기">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>
    <ul id="treeList" class="drawer-list"></ul>
    <div id="rootDropZone" class="root-drop-zone">이곳으로 드롭하여 최상단으로 이동</div>
  </aside>

  <!-- Modal Bottom Sheet -->
  <div id="sheetScrim" class="bottom-sheet-scrim"></div>
  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="sheetTargetTitle" class="sheet-header-title">문서 옵션</div>
    <button id="sheetAddDoc" class="sheet-item">
      <span class="material-symbols-rounded">note_add</span> 하위 문서 추가
    </button>
    <button id="sheetAddFolder" class="sheet-item">
      <span class="material-symbols-rounded">create_new_folder</span> 하위 폴더 추가
    </button>
    <button id="sheetEdit" class="sheet-item">
      <span class="material-symbols-rounded">edit_note</span> 내용 수정
    </button>
    <button id="sheetRename" class="sheet-item">
      <span class="material-symbols-rounded">drive_file_rename_outline</span> 이름 변경
    </button>
    <button id="sheetDelete" class="sheet-item danger">
      <span class="material-symbols-rounded">delete</span> 삭제
    </button>
  </div>

  <!-- M3 AlertDialog -->
  <div id="dialogScrim" class="dialog-scrim">
    <div class="m3-dialog">
      <div id="dialogTitle" class="dialog-title">제목</div>
      <div id="dialogContent" class="dialog-content" style="display: none;"></div>
      <input type="text" id="dialogInput" class="m3-input" placeholder="입력하세요">
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="btn-text">취소</button>
        <button id="dialogConfirmBtn" class="btn-text">확인</button>
      </div>
    </div>
  </div>

  <!-- 풀스크린 에디터 -->
  <div id="fullscreenEditor" class="fullscreen-editor">
    <div class="editor-top-bar">
      <button id="closeEditorBtn" class="icon-btn">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <span id="editorModeTitle" style="font-weight: 700; font-size: 18px;">문서 작성</span>
      <button id="saveDocBtn" class="btn-filled">저장</button>
    </div>
    <div class="editor-body">
      <input type="text" id="editorTitleInput" class="input-title" placeholder="제목을 입력하세요">
      <textarea id="editorContentInput" class="textarea-content" placeholder="마크다운 내용을 작성하거나 붙여넣으세요..."></textarea>
    </div>
  </div>

  <script>
    // --- LocalStorage 키 상수 ---
    const STORAGE_KEY_ITEMS = 'm3_doc_viewer_items';
    const STORAGE_KEY_ACTIVE = 'm3_doc_viewer_active_id';
    const STORAGE_KEY_THEME = 'm3_doc_viewer_theme';

    // 기본 초기 데이터 (저장소가 비어있을 때만 사용)
    const defaultItems = [
      { id: 'f_1', type: 'folder', title: '프로젝트 가이드', content: '', parentId: null, isExpanded: true },
      { id: 'd_1', type: 'doc', title: '시작하기 (README)', content: '# 안드로이드 M3 스타일 계층형 뷰어\n\n- **자동 저장 지원**: 모든 수정, 생성, 이동 내역은 `localStorage`에 실시간 보관됩니다.\n- **Material 3 Navigation Drawer**로 폴더를 탐색합니다.\n- 문서를 드래그앤드롭하여 원하는 폴더나 계층으로 이동시킬 수 있습니다.\n- 우하단 FAB 버튼을 눌러 바로 새 문서를 작성할 수 있습니다.', parentId: 'f_1', isExpanded: true }
    ];

    let items = [];
    let activeDocId = null;
    let currentEditDocId = null;
    let currentTargetParentId = null;
    let selectedSheetItemId = null;
    let draggedItemId = null;

    // DOM 바인딩
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const menuBtn = document.getElementById('menuBtn');
    const drawerScrim = document.getElementById('drawerScrim');
    const navDrawer = document.getElementById('navDrawer');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const addRootFolderBtn = document.getElementById('addRootFolderBtn');
    const treeList = document.getElementById('treeList');
    const mainContent = document.getElementById('mainContent');
    const rootDropZone = document.getElementById('rootDropZone');
    const fabBtn = document.getElementById('fabBtn');

    const tabHome = document.getElementById('tabHome');
    const tabExplore = document.getElementById('tabExplore');
    const tabCreate = document.getElementById('tabCreate');

    const sheetScrim = document.getElementById('sheetScrim');
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetTargetTitle = document.getElementById('sheetTargetTitle');
    const sheetAddDoc = document.getElementById('sheetAddDoc');
    const sheetAddFolder = document.getElementById('sheetAddFolder');
    const sheetEdit = document.getElementById('sheetEdit');
    const sheetRename = document.getElementById('sheetRename');
    const sheetDelete = document.getElementById('sheetDelete');

    const dialogScrim = document.getElementById('dialogScrim');
    const dialogTitle = document.getElementById('dialogTitle');
    const dialogContent = document.getElementById('dialogContent');
    const dialogInput = document.getElementById('dialogInput');
    const dialogCancelBtn = document.getElementById('dialogCancelBtn');
    const dialogConfirmBtn = document.getElementById('dialogConfirmBtn');
    let dialogCallback = null;

    const fullscreenEditor = document.getElementById('fullscreenEditor');
    const closeEditorBtn = document.getElementById('closeEditorBtn');
    const editorModeTitle = document.getElementById('editorModeTitle');
    const editorTitleInput = document.getElementById('editorTitleInput');
    const editorContentInput = document.getElementById('editorContentInput');
    const saveDocBtn = document.getElementById('saveDocBtn');

    // --- LocalStorage 저장 / 로드 함수 ---
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
        if (activeDocId) {
          localStorage.setItem(STORAGE_KEY_ACTIVE, activeDocId);
        } else {
          localStorage.removeItem(STORAGE_KEY_ACTIVE);
        }
      } catch (e) {
        console.error('LocalStorage 저장 실패:', e);
      }
    }

    function loadFromStorage() {
      try {
        const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
        if (savedItems) {
          items = JSON.parse(savedItems);
        } else {
          items = [...defaultItems];
        }

        const savedActiveId = localStorage.getItem(STORAGE_KEY_ACTIVE);
        if (savedActiveId && items.some(i => i.id === savedActiveId && i.type === 'doc')) {
          activeDocId = savedActiveId;
        } else {
          const firstDoc = items.find(i => i.type === 'doc');
          activeDocId = firstDoc ? firstDoc.id : null;
        }

        // 테마 로드
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        if (savedTheme === 'dark') {
          document.body.classList.add('dark-mode');
          themeIcon.textContent = 'light_mode';
        } else {
          document.body.classList.remove('dark-mode');
          themeIcon.textContent = 'dark_mode';
        }
      } catch (e) {
        console.error('LocalStorage 로드 실패:', e);
        items = [...defaultItems];
        activeDocId = 'd_1';
      }
    }

    // --- 테마 토글 ---
    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      themeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    });

    // --- 드로어 컨트롤 ---
    function setDrawer(open) {
      if (open) {
        navDrawer.classList.add('open');
        drawerScrim.classList.add('open');
        setTabActive(tabExplore);
      } else {
        navDrawer.classList.remove('open');
        drawerScrim.classList.remove('open');
        setTabActive(tabHome);
      }
    }

    menuBtn.addEventListener('click', () => setDrawer(true));
    closeDrawerBtn.addEventListener('click', () => setDrawer(false));
    drawerScrim.addEventListener('click', () => setDrawer(false));

    function setTabActive(tab) {
      [tabHome, tabExplore, tabCreate].forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    }

    tabHome.addEventListener('click', () => {
      setDrawer(false);
      setTabActive(tabHome);
    });
    tabExplore.addEventListener('click', () => setDrawer(true));
    tabCreate.addEventListener('click', () => {
      setTabActive(tabCreate);
      openEditor(null, null);
    });
    fabBtn.addEventListener('click', () => openEditor(null, null));

    // --- M3 다이얼로그 헬퍼 ---
    function showInputDialog(title, defaultValue, onConfirm) {
      dialogTitle.textContent = title;
      dialogContent.style.display = 'none';
      dialogInput.style.display = 'block';
      dialogInput.value = defaultValue || '';
      dialogCallback = onConfirm;
      dialogScrim.classList.add('open');
      dialogInput.focus();
    }

    function showConfirmDialog(title, message, onConfirm) {
      dialogTitle.textContent = title;
      dialogContent.textContent = message;
      dialogContent.style.display = 'block';
      dialogInput.style.display = 'none';
      dialogCallback = onConfirm;
      dialogScrim.classList.add('open');
    }

    function closeDialog() {
      dialogScrim.classList.remove('open');
      dialogCallback = null;
    }

    dialogCancelBtn.addEventListener('click', closeDialog);
    dialogConfirmBtn.addEventListener('click', () => {
      if (dialogCallback) {
        dialogCallback(dialogInput.value);
      }
      closeDialog();
    });

    // --- 바텀 시트 컨트롤 ---
    function openBottomSheet(item) {
      selectedSheetItemId = item.id;
      sheetTargetTitle.textContent = item.title;
      sheetEdit.style.display = item.type === 'doc' ? 'flex' : 'none';
      bottomSheet.classList.add('open');
      sheetScrim.classList.add('open');
    }

    function closeBottomSheet() {
      bottomSheet.classList.remove('open');
      sheetScrim.classList.remove('open');
      selectedSheetItemId = null;
    }

    sheetScrim.addEventListener('click', closeBottomSheet);

    sheetAddDoc.addEventListener('click', () => {
      const parentId = selectedSheetItemId;
      closeBottomSheet();
      openEditor(null, parentId);
    });

    sheetAddFolder.addEventListener('click', () => {
      const parentId = selectedSheetItemId;
      closeBottomSheet();
      showInputDialog('새 폴더 생성', '새 폴더', (folderName) => {
        if (folderName && folderName.trim()) {
          createFolder(folderName.trim(), parentId);
        }
      });
    });

    sheetEdit.addEventListener('click', () => {
      const id = selectedSheetItemId;
      const target = items.find(i => i.id === id);
      closeBottomSheet();
      if (target) openEditor(id, target.parentId);
    });

    sheetRename.addEventListener('click', () => {
      const id = selectedSheetItemId;
      const target = items.find(i => i.id === id);
      closeBottomSheet();
      if (target) {
        showInputDialog('이름 변경', target.title, (newName) => {
          if (newName && newName.trim()) {
            target.title = newName.trim();
            saveToStorage();
            renderTree();
          }
        });
      }
    });

    sheetDelete.addEventListener('click', () => {
      const id = selectedSheetItemId;
      const target = items.find(i => i.id === id);
      closeBottomSheet();
      if (target) {
        showConfirmDialog('항목 삭제', `'${target.title}' 및 하위의 모든 항목을 삭제하시겠습니까?`, () => {
          deleteItemRecursive(id);
          saveToStorage();
          renderTree();
        });
      }
    });

    // --- 에디터 열기/저장 ---
    function openEditor(docId = null, parentId = null) {
      currentEditDocId = docId;
      currentTargetParentId = parentId;

      if (docId) {
        const doc = items.find(i => i.id === docId);
        editorModeTitle.textContent = '문서 수정';
        editorTitleInput.value = doc.title;
        editorContentInput.value = doc.content;
      } else {
        editorModeTitle.textContent = parentId ? '하위 문서 작성' : '새 문서 작성';
        editorTitleInput.value = '';
        editorContentInput.value = '';
      }

      fullscreenEditor.classList.add('open');
      editorTitleInput.focus();
    }

    function closeEditor() {
      fullscreenEditor.classList.remove('open');
      currentEditDocId = null;
      currentTargetParentId = null;
      setTabActive(tabHome);
    }

    closeEditorBtn.addEventListener('click', closeEditor);

    saveDocBtn.addEventListener('click', () => {
      const title = editorTitleInput.value.trim() || '무제';
      const content = editorContentInput.value;

      if (currentEditDocId) {
        const doc = items.find(i => i.id === currentEditDocId);
        if (doc) {
          doc.title = title;
          doc.content = content;
          if (activeDocId === currentEditDocId) renderMainViewer(doc);
        }
      } else {
        const newDoc = {
          id: 'doc_' + Date.now(),
          type: 'doc',
          title: title,
          content: content,
          parentId: currentTargetParentId,
          isExpanded: true
        };
        items.push(newDoc);
        if (currentTargetParentId) {
          const parent = items.find(i => i.id === currentTargetParentId);
          if (parent) parent.isExpanded = true;
        }
        renderMainViewer(newDoc);
      }

      saveToStorage();
      renderTree();
      closeEditor();
    });

    addRootFolderBtn.addEventListener('click', () => {
      showInputDialog('새 폴더 생성', '새 폴더', (folderName) => {
        if (folderName && folderName.trim()) {
          createFolder(folderName.trim(), null);
        }
      });
    });

    function createFolder(title, parentId) {
      const newFolder = {
        id: 'folder_' + Date.now(),
        type: 'folder',
        title: title,
        content: '',
        parentId: parentId,
        isExpanded: true
      };
      items.push(newFolder);
      if (parentId) {
        const parent = items.find(i => i.id === parentId);
        if (parent) parent.isExpanded = true;
      }
      saveToStorage();
      renderTree();
    }

    // --- 뷰어 렌더링 ---
    function renderMainViewer(doc) {
      if (!doc || doc.type === 'folder') return;
      activeDocId = doc.id;
      saveToStorage();
      mainContent.innerHTML = marked.parse(doc.content || '');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderEmptyPlaceholder() {
      mainContent.innerHTML = `
        <div class="empty-placeholder">
          <span class="material-symbols-rounded" style="font-size: 48px;">description</span>
          <p>표시할 문서가 없습니다.<br>오른쪽 아래 + 버튼을 눌러 새 문서를 작성해보세요.</p>
        </div>
      `;
    }

    // --- 계층 트리 렌더링 & Drag and Drop ---
    function renderTree() {
      treeList.innerHTML = '';
      renderNodes(null, 0);
    }

    function renderNodes(parentId, depth) {
      const children = items.filter(i => i.parentId === parentId);

      children.forEach(item => {
        const hasChildren = items.some(i => i.parentId === item.id);
        const li = document.createElement('li');
        li.className = `tree-node ${activeDocId === item.id ? 'active-doc' : ''}`;
        li.draggable = true;
        li.dataset.id = item.id;
        li.style.paddingLeft = `${12 + depth * 16}px`;

        // 토글 화살표
        const arrow = document.createElement('span');
        arrow.className = 'node-arrow';
        if (hasChildren || item.type === 'folder') {
          arrow.innerHTML = `<span class="material-symbols-rounded" style="font-size: 20px;">${item.isExpanded ? 'expand_more' : 'chevron_right'}</span>`;
          arrow.addEventListener('click', (e) => {
            e.stopPropagation();
            item.isExpanded = !item.isExpanded;
            saveToStorage();
            renderTree();
          });
        }
        li.appendChild(arrow);

        // 아이콘
        const icon = document.createElement('span');
        icon.className = 'node-icon';
        if (item.type === 'folder') {
          icon.innerHTML = `<span class="material-symbols-rounded" style="font-size: 22px;">${item.isExpanded ? 'folder_open' : 'folder'}</span>`;
        } else {
          icon.innerHTML = `<span class="material-symbols-rounded" style="font-size: 22px;">article</span>`;
        }
        li.appendChild(icon);

        // 텍스트 라벨
        const titleSpan = document.createElement('span');
        titleSpan.className = 'node-title';
        titleSpan.textContent = item.title;
        titleSpan.addEventListener('click', () => {
          if (item.type === 'doc') {
            renderMainViewer(item);
            setDrawer(false);
            renderTree();
          } else {
            item.isExpanded = !item.isExpanded;
            saveToStorage();
            renderTree();
          }
        });
        li.appendChild(titleSpan);

        // 점 세개 (More) 버튼 -> 바텀시트
        const moreBtn = document.createElement('button');
        moreBtn.className = 'icon-btn';
        moreBtn.style.width = '36px';
        moreBtn.style.height = '36px';
        moreBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 20px;">more_vert</span>';
        moreBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openBottomSheet(item);
        });
        li.appendChild(moreBtn);

        // 드래그 앤 드롭
        li.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedItemId = item.id;
          li.classList.add('dragging');
          rootDropZone.classList.add('active');
          e.dataTransfer.effectAllowed = 'move';
        });

        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (draggedItemId && draggedItemId !== item.id && !isDescendant(draggedItemId, item.id)) {
            li.classList.add('drag-over');
          }
        });

        li.addEventListener('dragleave', (e) => {
          e.stopPropagation();
          li.classList.remove('drag-over');
        });

        li.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          li.classList.remove('drag-over');

          if (draggedItemId && draggedItemId !== item.id && !isDescendant(draggedItemId, item.id)) {
            const dragged = items.find(i => i.id === draggedItemId);
            if (dragged) {
              dragged.parentId = item.id;
              item.isExpanded = true;
              saveToStorage();
              renderTree();
            }
          }
        });

        li.addEventListener('dragend', () => {
          draggedItemId = null;
          li.classList.remove('dragging');
          rootDropZone.classList.remove('active');
          document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('drag-over'));
        });

        treeList.appendChild(li);

        if (hasChildren && item.isExpanded) {
          renderNodes(item.id, depth + 1);
        }
      });
    }

    // 최상단 루트 드롭존
    rootDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      rootDropZone.style.borderColor = 'var(--md-sys-color-primary)';
    });
    rootDropZone.addEventListener('dragleave', () => {
      rootDropZone.style.borderColor = '';
    });
    rootDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      rootDropZone.style.borderColor = '';
      if (draggedItemId) {
        const dragged = items.find(i => i.id === draggedItemId);
        if (dragged) {
          dragged.parentId = null;
          saveToStorage();
          renderTree();
        }
      }
    });

    function deleteItemRecursive(id) {
      const children = items.filter(i => i.parentId === id);
      children.forEach(child => deleteItemRecursive(child.id));

      if (activeDocId === id) {
        activeDocId = null;
        renderEmptyPlaceholder();
      }
      items = items.filter(i => i.id !== id);
    }

    function isDescendant(parentId, targetId) {
      if (parentId === targetId) return true;
      const children = items.filter(i => i.parentId === parentId);
      for (const child of children) {
        if (isDescendant(child.id, targetId)) return true;
      }
      return false;
    }

    // --- 앱 최초 시작 및 초기화 ---
    loadFromStorage();
    renderTree();

    const currentDoc = items.find(i => i.id === activeDocId);
    if (currentDoc && currentDoc.type === 'doc') {
      renderMainViewer(currentDoc);
    } else {
      renderEmptyPlaceholder();
    }
  </script>
</body>
</html>
