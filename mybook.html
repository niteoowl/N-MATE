<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Professional Mobile Editor V2</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #191f28;
            --text-sub: #4e5968;
            --border: #e5e8eb;
            --accent: #3182f7;
            --danger: #f04452;
            --input-bg: #f2f4f6;
        }

        [data-theme="dark"] {
            --bg: #111111;
            --text-main: #f9fafb;
            --text-sub: #adb5bd;
            --border: #2c2c2e;
            --accent: #5499ff;
            --input-bg: #1c1c1e;
        }

        /* 초기화: 애니메이션/그림자 절대 금지 */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
            transition: none !important;
            box-shadow: none !important;
        }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg); color: var(--text-main);
            position: fixed; /* 키보드 팝업 시 너비 줄어듦 방지 */
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; height: 54px; border-bottom: 1px solid var(--border);
            background: var(--bg);
        }
        .logo { font-size: 14px; font-weight: 800; letter-spacing: -0.5px; }

        /* 워드 스타일 툴바 */
        .toolbar {
            display: flex; overflow-x: auto; padding: 8px 16px; gap: 8px;
            border-bottom: 1px solid var(--border); background: var(--bg);
            align-items: center; -ms-overflow-style: none; scrollbar-width: none;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        
        .tool-group {
            display: flex; background: var(--input-bg); border-radius: 6px; padding: 2px; align-items: center;
        }

        .px-select {
            border: none; background: transparent; font-size: 11px; font-weight: 700;
            padding: 4px 8px; color: var(--text-main); outline: none;
        }

        .t-btn {
            border: none; background: transparent; padding: 6px;
            border-radius: 4px; color: var(--text-main); display: flex; align-items: center;
        }
        .t-btn svg { width: 16px; height: 16px; }

        /* 챕터 네비게이션 */
        .chapter-nav {
            display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px;
            border-bottom: 1px solid var(--border); background: var(--bg);
        }
        .chapter-tab {
            padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: 700;
            color: var(--text-sub); border: 1px solid var(--border); white-space: nowrap;
        }
        .chapter-tab.active { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

        /* 에디터 스크롤 영역 */
        #editor-scroll-area {
            flex: 1; overflow-y: auto; width: 100%; height: calc(100% - 220px);
            padding: 24px 20px 200px 20px; /* 하단 넉넉한 패딩 */
            -webkit-overflow-scrolling: touch;
        }
        .title-input {
            width: 100%; border: none; outline: none; background: transparent;
            font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 16px;
        }
        .content-editor {
            width: 100%; min-height: 250px; outline: none;
            font-size: 17px; line-height: 1.8; color: var(--text-main);
        }
        .content-editor img { max-width: 100%; border-radius: 8px; margin: 12px 0; }

        /* 하단 액션 바 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg); border-top: 1px solid var(--border);
            padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .btn {
            border: none; background: var(--input-bg); padding: 8px 12px;
            border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 4px;
        }
        .btn-blue { background: var(--accent); color: #fff; }

        /* 검색 팝업 */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 2000; display: none; flex-direction: column;
        }
        .search-box { padding: 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
        .search-input { flex: 1; border: none; background: var(--input-bg); padding: 10px; border-radius: 8px; color: var(--text-main); outline: none; }
        .img-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
        .img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }

    </style>
</head>
<body>

<header>
    <div class="logo">TOSS WRITER PRO</div>
    <button class="t-btn" onclick="toggleDarkMode()"><i data-lucide="moon"></i></button>
</header>

<div class="toolbar">
    <div class="tool-group">
        <select class="px-select" id="fontSize" onchange="changeFontSize(this.value)">
            <option value="12px">12px</option>
            <option value="14px">14px</option>
            <option value="16px" selected>16px</option>
            <option value="18px">18px</option>
            <option value="20px">20px</option>
            <option value="24px">24px</option>
            <option value="32px">32px</option>
        </select>
        <button class="t-btn" onclick="exec('bold')"><i data-lucide="bold"></i></button>
        <button class="t-btn" onclick="exec('underline')"><i data-lucide="underline"></i></button>
    </div>
    <div class="tool-group">
        <button class="t-btn" onclick="exec('justifyLeft')"><i data-lucide="align-left"></i></button>
        <button class="t-btn" onclick="exec('justifyCenter')"><i data-lucide="align-center"></i></button>
        <button class="t-btn" onclick="openModal()"><i data-lucide="image"></i></button>
    </div>
</div>

<div class="chapter-nav" id="nav-area"></div>

<main id="editor-scroll-area">
    <input type="text" id="chapter-title" class="title-input" placeholder="제목을 입력하세요" oninput="saveData()">
    <div id="editor-body" class="content-editor" contenteditable="true" oninput="saveData()"></div>
</main>

<footer class="bottom-bar" id="footer-bar">
    <span style="font-size: 11px; font-weight: 700; color: var(--text-sub);" id="save-label">저장됨</span>
    <div style="display: flex; gap: 6px;">
        <button class="btn" style="color: var(--danger)" onclick="deleteChapter()">삭제</button>
        <button class="btn btn-blue" onclick="exportData()">저장</button>
    </div>
</footer>

<div id="modal">
    <div class="search-box">
        <input type="text" id="img-q" class="search-input" placeholder="검색어 (영어)">
        <button class="btn btn-blue" onclick="searchImages()">검색</button>
        <button class="btn" onclick="closeModal()">취소</button>
    </div>
    <div id="img-results" class="img-grid"></div>
</div>

<script>
    let book = {
        activeId: null,
        chapters: [{ id: Date.now(), title: "무제", content: "" }]
    };

    const titleEl = document.getElementById('chapter-title');
    const bodyEl = document.getElementById('editor-body');
    const footer = document.getElementById('footer-bar');

    window.onload = () => {
        const saved = localStorage.getItem('TOSS_WRITER_FINAL');
        if (saved) book = JSON.parse(saved);
        if (!book.activeId) book.activeId = book.chapters[0].id;
        
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        
        renderNav();
        updateUI(); // 초기 UI 로드
        lucide.createIcons();
        initKeyboardHandler();
    };

    function initKeyboardHandler() {
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const vv = window.visualViewport;
                const offset = window.innerHeight - vv.height;
                footer.style.bottom = offset > 50 ? offset + 'px' : '0px';
            });
        }
    }

    function renderNav() {
        const nav = document.getElementById('nav-area');
        nav.innerHTML = '';
        book.chapters.forEach(ch => {
            const tab = document.createElement('div');
            tab.className = `chapter-tab ${ch.id === book.activeId ? 'active' : ''}`;
            tab.innerText = ch.title || '무제';
            tab.onclick = () => switchChapter(ch.id);
            nav.appendChild(tab);
        });
        const addBtn = document.createElement('div');
        addBtn.className = 'chapter-tab';
        addBtn.innerText = '+ 추가';
        addBtn.onclick = addChapter;
        nav.appendChild(addBtn);
    }

    // 챕터 전환 시 덮어쓰기 방지 핵심 로직
    function switchChapter(id) {
        saveData(); // 이동 전 현재 내용 저장
        book.activeId = id;
        updateUI(); // 바뀐 ID로 UI 갱신
        renderNav();
    }

    function updateUI() {
        const ch = book.chapters.find(c => c.id === book.activeId);
        if (ch) {
            titleEl.value = ch.title;
            bodyEl.innerHTML = ch.content;
        }
    }

    function saveData() {
        const ch = book.chapters.find(c => c.id === book.activeId);
        if (ch) {
            ch.title = titleEl.value;
            ch.content = bodyEl.innerHTML;
        }
        localStorage.setItem('TOSS_WRITER_FINAL', JSON.stringify(book));
        const activeTab = document.querySelector('.chapter-tab.active');
        if (activeTab) activeTab.innerText = titleEl.value || '무제';
    }

    function addChapter() {
        saveData(); // 새 챕터 만들기 전 기존 내용 저장
        const newId = Date.now();
        const newChapter = { id: newId, title: "새로운 장", content: "" };
        book.chapters.push(newChapter);
        book.activeId = newId;
        
        // UI 즉시 초기화 (덮어쓰기 방지)
        titleEl.value = newChapter.title;
        bodyEl.innerHTML = newChapter.content;
        
        saveData();
        renderNav();
    }

    function deleteChapter() {
        if (book.chapters.length <= 1) return;
        if (!confirm("삭제할까요?")) return;
        book.chapters = book.chapters.filter(c => c.id !== book.activeId);
        book.activeId = book.chapters[0].id;
        updateUI();
        saveData();
        renderNav();
    }

    function exec(n, v = null) {
        document.execCommand(n, false, v);
        saveData();
    }

    function changeFontSize(size) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = size;
            range.surroundContents(span);
        }
        saveData();
    }

    function toggleDarkMode() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function searchImages() {
        const q = document.getElementById('img-q').value || 'paper';
        const res = document.getElementById('img-results');
        res.innerHTML = '검색 중...';
        let html = '';
        for (let i = 0; i < 8; i++) {
            const url = `https://loremflickr.com/600/600/${encodeURIComponent(q)}?lock=${i + Math.random()}`;
            html += `<img src="${url}" onclick="insertImg('${url}')">`;
        }
        res.innerHTML = html;
    }

    function insertImg(url) {
        bodyEl.focus();
        document.execCommand('insertHTML', false, `<img src="${url}"><br>`);
        closeModal();
        saveData();
    }

    function exportData() {
        let text = "";
        book.chapters.forEach(ch => {
            text += `[${ch.title}]\n${ch.content.replace(/<[^>]*>?/gm, '')}\n\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a.download = 'book.txt';
        a.click();
    }
</script>
</body>
</html>
