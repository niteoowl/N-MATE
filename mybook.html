<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toss Publisher Premium</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #191f28;
            --sub: #4e5968;
            --border: #e5e8eb;
            --accent: #3182f7;
            --danger: #f04452;
            --gray: #f2f4f6;
        }
        [data-theme="dark"] {
            --bg: #111111;
            --text: #f9fafb;
            --sub: #adb5bd;
            --border: #2c2c2e;
            --accent: #5499ff;
            --gray: #1c1c1e;
        }

        /* RESET & NO ANIMATION */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; transition: none !important; box-shadow: none !important; }
        
        html, body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background: var(--bg); color: var(--text); position: fixed; 
        }

        /* Main App Container with Top/Bottom Safe Margin */
        #app { 
            display: flex; flex-direction: column; 
            width: 100vw; height: 100dvh; 
            padding-top: 16px; /* 상단 비우기 */
            padding-bottom: 16px; /* 하단 비우기 */
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 44px; flex-shrink: 0; }
        .logo { font-size: 15px; font-weight: 900; letter-spacing: -0.5px; }

        .toolbar { display: flex; overflow-x: auto; padding: 12px 16px; gap: 8px; border-bottom: 1px solid var(--border); align-items: center; flex-shrink: 0; }
        .toolbar::-webkit-scrollbar { display: none; }
        .tool-group { display: flex; background: var(--gray); border-radius: 8px; padding: 2px; align-items: center; flex-shrink: 0; }
        
        .size-btn { border: none; background: transparent; font-size: 11px; font-weight: 800; padding: 6px 10px; color: var(--text); border-right: 1px solid var(--border); }
        .size-btn:last-child { border-right: none; }
        .t-icon { border: none; background: transparent; padding: 8px; border-radius: 6px; color: var(--text); display: flex; align-items: center; }
        .t-icon svg { width: 18px; height: 18px; }

        .nav { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab { padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--sub); border: 1px solid var(--border); white-space: nowrap; }
        .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        /* Editor Area */
        #editor-scroll { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
        .title-in { width: 100%; border: none; outline: none; background: transparent; font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 15px; }
        .editor-in { width: 100%; min-height: 200px; outline: none; font-size: 17px; line-height: 1.7; color: var(--text); }
        
        .code-box { background: #2d2d2d; color: #eee; padding: 16px; border-radius: 8px; font-family: monospace; margin: 15px 0; white-space: pre; overflow-x: auto; display: block; }

        /* Bottom Action Bar */
        #footer { 
            position: fixed; bottom: 16px; /* 하단 비우기 고정 */
            left: 0; width: 100vw; 
            background: var(--bg); border-top: 1px solid var(--border); 
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .btn { border: none; background: var(--gray); padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text); }
        .btn-blue { background: var(--accent); color: #fff; }

        /* Image Modal */
        #modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 2000; display: none; flex-direction: column; padding-top: 40px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; overflow-y: auto; }
        .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="logo">TOSS PUBLISHER</div>
        <button class="t-icon" onmousedown="event.preventDefault(); toggleDark()"><i data-lucide="moon"></i></button>
    </header>

    <div class="toolbar">
        <div class="tool-group">
            <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('14px')">14</button>
            <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('18px')">18</button>
            <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('24px')">24</button>
            <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('32px')">32</button>
        </div>
        <div class="tool-group">
            <button class="t-icon" onmousedown="event.preventDefault(); exec('bold')"><i data-lucide="bold"></i></button>
            <button class="t-icon" onmousedown="event.preventDefault(); exec('underline')"><i data-lucide="underline"></i></button>
        </div>
        <div class="tool-group">
            <button class="t-icon" onmousedown="event.preventDefault(); insertCode()"><i data-lucide="code"></i></button>
            <button class="t-icon" onmousedown="event.preventDefault(); openImg()"><i data-lucide="image"></i></button>
            <button id="prev-btn" class="t-icon" onmousedown="event.preventDefault(); togglePrev()"><i data-lucide="eye"></i></button>
        </div>
    </div>

    <div class="nav" id="nav"></div>

    <main id="editor-scroll">
        <input type="text" id="title-in" class="title-in" placeholder="제목 없는 장" oninput="save()">
        <div id="editor-in" class="editor-in" contenteditable="true" oninput="save()"></div>
    </main>

    <footer id="footer">
        <div id="save-status" style="font-size:11px; font-weight:800; color:var(--sub)">저장 완료</div>
        <div style="display:flex; gap:8px;">
            <button class="btn" style="color:var(--danger)" onclick="delChapter()">삭제</button>
            <button class="btn btn-blue" onclick="exportDoc()">저장</button>
        </div>
    </footer>
</div>

<div id="modal">
    <div style="padding:16px; display:flex; gap:8px; border-bottom:1px solid var(--border)">
        <input type="text" id="img-q" style="flex:1; border:none; background:var(--gray); padding:12px; border-radius:8px; outline:none;" placeholder="이미지 검색 (영어)">
        <button class="btn btn-blue" onclick="search()">검색</button>
        <button class="btn" onclick="closeImg()">닫기</button>
    </div>
    <div id="img-res" class="grid"></div>
</div>

<script>
    let db = { active: null, chapters: [{ id: Date.now(), title: "프롤로그", content: "첫 문장을 시작하세요." }] };
    let isPrev = false;
    let savedRange = null;

    const editor = document.getElementById('editor-in');
    const title = document.getElementById('title-in');
    const footer = document.getElementById('footer');
    const app = document.getElementById('app');

    window.onload = () => {
        const saved = localStorage.getItem('TP_FINAL_VER');
        if (saved) db = JSON.parse(saved);
        if (!db.active) db.active = db.chapters[0].id;
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        
        renderNav();
        load();
        lucide.createIcons();
        
        // 키보드 대응 및 뷰포트 최적화
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const vv = window.visualViewport;
                const offset = window.innerHeight - vv.height;
                
                // 앱 높이를 키보드 제외 가용 영역으로 맞추되 상하단 여백 고려
                app.style.height = vv.height + 'px';
                
                if (offset > 50) {
                    footer.style.bottom = offset + 'px'; // 키보드 바로 위
                } else {
                    footer.style.bottom = '16px'; // 원래 설정한 하단 비우기 공간
                }
            });
        }

        // 선택 영역 실시간 저장 (모바일 드래그 유지용)
        document.onselectionchange = () => {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) savedRange = range.cloneRange();
            }
        };
    };

    function renderNav() {
        const nav = document.getElementById('nav');
        nav.innerHTML = '';
        db.chapters.forEach(ch => {
            const t = document.createElement('div');
            t.className = `tab ${ch.id === db.active ? 'active' : ''}`;
            t.innerText = ch.title || '무제';
            t.onclick = () => { save(); db.active = ch.id; load(); renderNav(); };
            nav.appendChild(t);
        });
        const add = document.createElement('div');
        add.className = 'tab'; add.innerText = '+ 장 추가';
        add.onclick = () => {
            save();
            const id = Date.now();
            db.chapters.push({ id, title: "새로운 장", content: "" });
            db.active = id;
            load(); renderNav();
        };
        nav.appendChild(add);
    }

    function load() {
        const ch = db.chapters.find(c => c.id === db.active);
        title.value = ch.title;
        editor.innerHTML = ch.content;
    }

    function save() {
        if(isPrev) return;
        const ch = db.chapters.find(c => c.id === db.active);
        if (ch) {
            ch.title = title.value;
            ch.content = editor.innerHTML;
        }
        localStorage.setItem('TP_FINAL_VER', JSON.stringify(db));
        const activeTab = document.querySelector('.tab.active');
        if (activeTab) activeTab.innerText = title.value || '무제';
    }

    /* PX 글꼴 크기 적용 (드래그 유지 로직) */
    function applyFontSize(size) {
        if (!savedRange) return;
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);

        document.execCommand('fontSize', false, '7');
        editor.querySelectorAll('font[size="7"]').forEach(f => {
            f.removeAttribute('size');
            f.style.fontSize = size;
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.innerHTML = f.innerHTML;
            f.parentNode.replaceChild(span, f);
        });
        save();
    }

    function exec(cmd) {
        if (!savedRange) return;
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(savedRange);
        document.execCommand(cmd, false, null);
        save();
    }

    function insertCode() {
        const lang = prompt("언어 선택 (js, python, html)", "javascript") || "javascript";
        const h = `<div class="code-box" data-lang="${lang}" contenteditable="true"># 코드를 작성하세요</div><p><br></p>`;
        editor.focus();
        document.execCommand('insertHTML', false, h);
        save();
    }

    function togglePrev() {
        isPrev = !isPrev;
        const btn = document.getElementById('prev-btn');
        if (isPrev) {
            save();
            document.body.style.pointerEvents = 'none';
            footer.style.pointerEvents = 'auto';
            btn.style.color = 'var(--accent)';
            editor.querySelectorAll('.code-box').forEach(el => {
                const pre = document.createElement('pre');
                pre.className = `language-${el.dataset.lang}`;
                const code = document.createElement('code');
                code.textContent = el.innerText;
                pre.appendChild(code);
                el.innerHTML = ""; el.appendChild(pre);
            });
            Prism.highlightAllUnder(editor);
        } else {
            document.body.style.pointerEvents = 'auto';
            btn.style.color = 'var(--text)';
            load();
        }
    }

    function openImg() { document.getElementById('modal').style.display = 'flex'; }
    function closeImg() { document.getElementById('modal').style.display = 'none'; }

    async function search() {
        const q = document.getElementById('img-q').value || 'object';
        const res = document.getElementById('img-res');
        res.innerHTML = '검색 중...';
        let h = '';
        for (let i = 0; i < 6; i++) {
            const u = `https://loremflickr.com/600/600/${encodeURIComponent(q)}?lock=${i + Math.random()}`;
            h += `<img src="${u}" onclick="insertI('${u}')">`;
        }
        res.innerHTML = h;
    }

    function insertI(u) {
        editor.focus();
        document.execCommand('insertHTML', false, `<img src="${u}" style="width:100%; border-radius:12px; margin:15px 0;"><br>`);
        closeImg(); save();
    }

    function toggleDark() {
        const d = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', d ? 'light' : 'dark');
        localStorage.setItem('theme', d ? 'light' : 'dark');
    }

    function delChapter() {
        if (db.chapters.length <= 1) return;
        if (!confirm("이 장을 삭제할까요?")) return;
        db.chapters = db.chapters.filter(c => c.id !== db.active);
        db.active = db.chapters[0].id;
        load(); renderNav();
    }

    function exportDoc() {
        let t = "";
        db.chapters.forEach(ch => {
            const div = document.createElement('div'); div.innerHTML = ch.content;
            t += `[${ch.title}]\n${div.innerText}\n\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' }));
        a.download = 'my_book.txt'; a.click();
    }
</script>
</body>
</html>
