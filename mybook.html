<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Publisher Pro V3</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #191f28;
            --text-sub: #4e5968;
            --border: #e5e8eb;
            --accent: #3182f7;
            --danger: #f04452;
            --input-bg: #f2f4f6;
        }
        [data-theme="dark"] {
            --bg: #111111;
            --text-main: #f9fafb;
            --text-sub: #adb5bd;
            --border: #2c2c2e;
            --accent: #5499ff;
            --input-bg: #1c1c1e;
        }

        /* RESET - No Shadow, No Animation */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; transition: none !important; box-shadow: none !important; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text-main); position: fixed; }

        /* UI Components */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; height: 50px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .logo { font-size: 14px; font-weight: 800; }

        .toolbar { display: flex; overflow-x: auto; padding: 8px 16px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg); align-items: center; -ms-overflow-style: none; scrollbar-width: none; }
        .toolbar::-webkit-scrollbar { display: none; }
        .tool-group { display: flex; background: var(--input-bg); border-radius: 6px; padding: 2px; align-items: center; }
        
        .px-select { border: none; background: transparent; font-size: 11px; font-weight: 700; padding: 4px 8px; color: var(--text-main); outline: none; border-right: 1px solid var(--border); }
        .t-btn { border: none; background: transparent; padding: 6px; border-radius: 4px; color: var(--text-main); display: flex; align-items: center; }
        .t-btn svg { width: 16px; height: 16px; }
        .t-btn.active { background: var(--bg); color: var(--accent); }

        .chapter-nav { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid var(--border); }
        .chapter-tab { padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--text-sub); border: 1px solid var(--border); white-space: nowrap; }
        .chapter-tab.active { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

        /* Editor Area */
        #editor-container { flex: 1; overflow-y: auto; width: 100%; height: calc(100% - 210px); padding: 24px 20px 150px 20px; -webkit-overflow-scrolling: touch; }
        .title-input { width: 100%; border: none; outline: none; background: transparent; font-size: 26px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; }
        .content-editor { width: 100%; min-height: 200px; outline: none; font-size: 16px; line-height: 1.8; color: var(--text-main); }
        
        /* Code Block */
        .code-block { background: #2d2d2d; color: #f8f8f2; padding: 16px; border-radius: 8px; font-family: monospace; margin: 12px 0; white-space: pre; display: block; overflow-x: auto; }
        
        /* Bottom Bar */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .btn { border: none; background: var(--input-bg); padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 4px; }
        .btn-blue { background: var(--accent); color: #fff; }

        /* Modal */
        #img-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .search-box { padding: 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
        .img-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
        .img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }

        /* Preview Mode Override */
        body.preview-mode .content-editor, body.preview-mode .title-input { pointer-events: none; }
        body.preview-mode .toolbar, body.preview-mode .chapter-nav { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()">PUBLISHER PRO</div>
    <button class="t-btn" onclick="toggleDark()"><i data-lucide="moon"></i></button>
</header>

<div class="toolbar">
    <div class="tool-group">
        <select class="px-select" onchange="changeFontSize(this.value)">
            <option value="12px">12px</option>
            <option value="14px">14px</option>
            <option value="16px" selected>16px</option>
            <option value="18px">18px</option>
            <option value="20px">20px</option>
            <option value="24px">24px</option>
            <option value="32px">32px</option>
        </select>
        <button class="t-btn" onclick="exec('bold')"><i data-lucide="bold"></i></button>
        <button class="t-btn" onclick="exec('underline')"><i data-lucide="underline"></i></button>
    </div>
    <div class="tool-group">
        <button class="t-btn" onclick="exec('justifyLeft')"><i data-lucide="align-left"></i></button>
        <button class="t-btn" onclick="exec('justifyCenter')"><i data-lucide="align-center"></i></button>
    </div>
    <div class="tool-group">
        <button class="t-btn" onclick="insertCode()"><i data-lucide="code"></i></button>
        <button class="t-btn" onclick="openModal()"><i data-lucide="image"></i></button>
    </div>
    <div class="tool-group">
        <button id="prev-btn" class="t-btn" onclick="togglePreview()"><i data-lucide="eye"></i><span style="font-size:10px;margin-left:4px">미리보기</span></button>
    </div>
</div>

<div class="chapter-nav" id="nav-bar"></div>

<main id="editor-container">
    <input type="text" id="title-field" class="title-input" placeholder="장의 제목을 적으세요" oninput="save()">
    <div id="body-field" class="content-editor" contenteditable="true" oninput="save()"></div>
</main>

<footer class="bottom-bar" id="bottom-bar">
    <div id="save-status" style="font-size: 11px; font-weight: 700; color: var(--text-sub);">저장 완료</div>
    <div style="display: flex; gap: 8px;">
        <button class="btn" style="color: var(--danger)" onclick="deleteChapter()">삭제</button>
        <button class="btn btn-blue" onclick="exportFile()">내보내기</button>
    </div>
</footer>

<!-- Image Search -->
<div id="img-modal">
    <div class="search-box">
        <input type="text" id="img-q" style="flex:1; border:none; background:var(--input-bg); padding:10px; border-radius:8px; outline:none;" placeholder="이미지 검색 (영어)">
        <button class="btn btn-blue" onclick="search()">검색</button>
        <button class="btn" onclick="closeModal()">닫기</button>
    </div>
    <div id="img-results" class="img-grid"></div>
</div>

<script>
    let db = {
        activeId: null,
        chapters: [{ id: Date.now(), title: "무제", content: "" }]
    };
    let isPreview = false;

    const titleInput = document.getElementById('title-field');
    const bodyField = document.getElementById('body-field');
    const bottomBar = document.getElementById('bottom-bar');

    window.onload = () => {
        const saved = localStorage.getItem('PUBLISHER_PRO_DATA_V3');
        if (saved) db = JSON.parse(saved);
        if (!db.activeId) db.activeId = db.chapters[0].id;
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        renderNav();
        updateUI();
        lucide.createIcons();
        initViewport();
    };

    function initViewport() {
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const vv = window.visualViewport;
                const offset = window.innerHeight - vv.height;
                bottomBar.style.bottom = offset > 50 ? offset + 'px' : '0px';
            });
        }
    }

    function renderNav() {
        const nav = document.getElementById('nav-bar');
        nav.innerHTML = '';
        db.chapters.forEach(ch => {
            const tab = document.createElement('div');
            tab.className = `chapter-tab ${ch.id === db.activeId ? 'active' : ''}`;
            tab.innerText = ch.title || '무제';
            tab.onclick = () => switchChapter(ch.id);
            nav.appendChild(tab);
        });
        const add = document.createElement('div');
        add.className = 'chapter-tab';
        add.innerText = '+ 추가';
        add.onclick = addChapter;
        nav.appendChild(add);
    }

    function switchChapter(id) {
        if(isPreview) togglePreview();
        save();
        db.activeId = id;
        updateUI();
        renderNav();
    }

    function updateUI() {
        const ch = db.chapters.find(c => c.id === db.activeId);
        titleInput.value = ch.title;
        bodyField.innerHTML = ch.content;
    }

    function save() {
        if(isPreview) return;
        const ch = db.chapters.find(c => c.id === db.activeId);
        if (ch) {
            ch.title = titleInput.value;
            ch.content = bodyField.innerHTML;
        }
        localStorage.setItem('PUBLISHER_PRO_DATA_V3', JSON.stringify(db));
        const activeTab = document.querySelector('.chapter-tab.active');
        if (activeTab) activeTab.innerText = titleInput.value || '무제';
    }

    function addChapter() {
        save();
        const id = Date.now();
        const newCh = { id: id, title: "새 챕터", content: "" };
        db.chapters.push(newCh);
        db.activeId = id;
        
        titleInput.value = ""; 
        bodyField.innerHTML = ""; // 명시적 초기화 (복제 방지)
        
        save();
        renderNav();
    }

    function deleteChapter() {
        if (db.chapters.length <= 1) return;
        if (!confirm("삭제할까요?")) return;
        db.chapters = db.chapters.filter(c => c.id !== db.activeId);
        db.activeId = db.chapters[0].id;
        updateUI(); save(); renderNav();
    }

    // [핵심] PX 글꼴 크기 변경 함수
    function changeFontSize(size) {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;

        const range = sel.getRangeAt(0);
        if (range.collapsed) return; // 선택된 텍스트가 없으면 무시

        // 이미 적용된 폰트 사이즈가 있는지 확인하고 처리하는 대신, 
        // 가장 확실한 span wrapping 방식을 사용합니다.
        const span = document.createElement('span');
        span.style.fontSize = size;
        
        try {
            // 선택된 영역을 span으로 감쌉니다.
            range.surroundContents(span);
        } catch (e) {
            // 복잡한 선택 영역(여러 태그에 걸침)일 경우 execCommand와 병행
            document.execCommand('fontSize', false, '7');
            const fonts = bodyField.getElementsByTagName('font');
            for (let f of fonts) {
                if (f.size === "7") {
                    f.removeAttribute('size');
                    f.style.fontSize = size;
                }
            }
        }
        save();
    }

    function exec(n, v = null) {
        document.execCommand(n, false, v);
        save();
    }

    function insertCode() {
        const lang = prompt("언어 (예: js, html, python)", "javascript") || "javascript";
        const codeHtml = `<div class="code-block" data-lang="${lang}" contenteditable="true"># ${lang} 코드를 입력하세요</div><p><br></p>`;
        bodyField.focus();
        document.execCommand('insertHTML', false, codeHtml);
        save();
    }

    function togglePreview() {
        isPreview = !isPreview;
        const btn = document.getElementById('prev-btn');
        if (isPreview) {
            save();
            document.body.classList.add('preview-mode');
            btn.classList.add('active');
            // 프리뷰에서 코드 블록 렌더링
            bodyField.querySelectorAll('.code-block').forEach(el => {
                const pre = document.createElement('pre');
                pre.className = `language-${el.dataset.lang}`;
                const code = document.createElement('code');
                code.textContent = el.innerText;
                pre.appendChild(code);
                el.innerHTML = "";
                el.appendChild(pre);
            });
            Prism.highlightAllUnder(bodyField);
        } else {
            document.body.classList.remove('preview-mode');
            btn.classList.remove('active');
            updateUI();
        }
    }

    function openModal() { document.getElementById('img-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('img-modal').style.display = 'none'; }

    async function search() {
        const q = document.getElementById('img-q').value || 'minimal';
        const res = document.getElementById('img-results');
        res.innerHTML = '찾는 중...';
        let html = '';
        for (let i = 0; i < 6; i++) {
            const url = `https://loremflickr.com/600/600/${encodeURIComponent(q)}?lock=${i + Math.random()}`;
            html += `<img src="${url}" onclick="insertImg('${url}')">`;
        }
        res.innerHTML = html;
    }

    function insertImg(url) {
        bodyField.focus();
        document.execCommand('insertHTML', false, `<img src="${url}" style="width:100%; border-radius:8px; margin:10px 0;"><br>`);
        closeModal(); save();
    }

    function toggleDark() {
        const dark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
        localStorage.setItem('theme', dark ? 'light' : 'dark');
    }

    function exportFile() {
        let text = "";
        db.chapters.forEach(ch => {
            text += `[${ch.title}]\n${ch.content.replace(/<[^>]*>?/gm, '')}\n\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a.download = 'my-book.txt'; a.click();
    }
</script>
</body>
</html>
