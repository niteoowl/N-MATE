<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Publisher Mobile Ultimate</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #191f28;
            --text-sub: #4e5968;
            --border: #e5e8eb;
            --accent: #3182f7;
            --danger: #f04452;
            --input-bg: #f2f4f6;
        }
        [data-theme="dark"] {
            --bg: #111111;
            --text-main: #f9fafb;
            --text-sub: #adb5bd;
            --border: #2c2c2e;
            --accent: #5499ff;
            --input-bg: #1c1c1e;
        }

        /* RESET - No Shadow, No Animation */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; transition: none !important; box-shadow: none !important; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text-main); position: fixed; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 50px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .logo { font-size: 14px; font-weight: 900; }

        /* Toolbar - 가로 스크롤 강화 */
        .toolbar { display: flex; overflow-x: auto; padding: 8px 16px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg); align-items: center; -webkit-overflow-scrolling: touch; }
        .toolbar::-webkit-scrollbar { display: none; }
        .tool-group { display: flex; background: var(--input-bg); border-radius: 8px; padding: 2px; align-items: center; flex-shrink: 0; }
        
        /* PX 버튼 스타일 */
        .size-btn { border: none; background: transparent; font-size: 11px; font-weight: 800; padding: 6px 8px; color: var(--text-main); border-right: 1px solid var(--border); }
        .size-btn:last-child { border-right: none; }
        
        .t-btn { border: none; background: transparent; padding: 8px; border-radius: 6px; color: var(--text-main); display: flex; align-items: center; justify-content: center; }
        .t-btn svg { width: 18px; height: 18px; }
        .t-btn.active { background: var(--accent); color: white; }

        /* Chapter Navigation */
        .chapter-nav { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .chapter-tab { padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--text-sub); border: 1px solid var(--border); white-space: nowrap; background: var(--bg); }
        .chapter-tab.active { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

        /* Main Editor */
        #editor-container { flex: 1; overflow-y: auto; width: 100%; height: calc(100% - 210px); padding: 20px 20px 300px 20px; -webkit-overflow-scrolling: touch; }
        .title-input { width: 100%; border: none; outline: none; background: transparent; font-size: 26px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; }
        .content-editor { width: 100%; min-height: 300px; outline: none; font-size: 16px; line-height: 1.8; color: var(--text-main); }
        
        /* Code Block */
        .code-block-item { background: #2d2d2d; color: #eee; padding: 16px; border-radius: 8px; font-family: monospace; margin: 16px 0; white-space: pre; overflow-x: auto; display: block; }

        /* Bottom Bar */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .btn { border: none; background: var(--input-bg); padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .btn-blue { background: var(--accent); color: #fff; }

        /* Modals */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .img-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
        .img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }

        /* Mode Overlay */
        body.preview-active .content-editor, body.preview-active .title-input { pointer-events: none; }
        body.preview-active .toolbar, body.preview-active .chapter-nav { opacity: 0.2; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">TOSS PUBLISHER PRO</div>
    <button class="t-btn" onmousedown="event.preventDefault(); toggleDark()"><i data-lucide="moon"></i></button>
</header>

<div class="toolbar">
    <!-- PX 크기 선택 그룹 (버튼형으로 변경하여 포커스 유지) -->
    <div class="tool-group">
        <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('14px')">14</button>
        <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('18px')">18</button>
        <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('24px')">24</button>
        <button class="size-btn" onmousedown="event.preventDefault(); applyFontSize('32px')">32</button>
    </div>
    <!-- 서식 그룹 -->
    <div class="tool-group">
        <button class="t-btn" onmousedown="event.preventDefault(); doExec('bold')"><i data-lucide="bold"></i></button>
        <button class="t-btn" onmousedown="event.preventDefault(); doExec('underline')"><i data-lucide="underline"></i></button>
    </div>
    <!-- 도구 그룹 -->
    <div class="tool-group">
        <button class="t-btn" onmousedown="event.preventDefault(); insertCode()"><i data-lucide="code"></i></button>
        <button class="t-btn" onmousedown="event.preventDefault(); openImgModal()"><i data-lucide="image"></i></button>
    </div>
    <!-- 프리뷰 -->
    <div class="tool-group">
        <button id="preview-toggle" class="t-btn" onmousedown="event.preventDefault(); togglePreview()"><i data-lucide="eye"></i></button>
    </div>
</div>

<div class="chapter-nav" id="nav-list"></div>

<main id="editor-container">
    <input type="text" id="chapter-title" class="title-input" placeholder="제목 없는 장" oninput="saveData()">
    <div id="editor-body" class="content-editor" contenteditable="true" oninput="saveData()"></div>
</main>

<footer class="bottom-bar" id="footer-bar">
    <div id="status-label" style="font-size: 11px; font-weight: 800; color: var(--text-sub);">실시간 저장 중</div>
    <div style="display: flex; gap: 8px;">
        <button class="btn" style="color: var(--danger)" onclick="deleteChapter()">삭제</button>
        <button class="btn btn-blue" onclick="exportFile()">파일 저장</button>
    </div>
</footer>

<!-- Modals -->
<div id="modal-overlay">
    <div style="padding:16px; display:flex; gap:8px; border-bottom:1px solid var(--border)">
        <input type="text" id="img-query" style="flex:1; border:none; background:var(--input-bg); padding:12px; border-radius:8px; outline:none;" placeholder="이미지 키워드 (영어)">
        <button class="btn btn-blue" onclick="searchImages()">검색</button>
        <button class="btn" onclick="closeImgModal()">닫기</button>
    </div>
    <div id="img-results" class="img-grid"></div>
</div>

<script>
    let state = {
        activeId: null,
        chapters: [{ id: Date.now(), title: "프롤로그", content: "첫 줄을 시작하세요." }]
    };
    let isPreview = false;
    let savedRange = null; // 선택 영역 보존 변수

    const titleInput = document.getElementById('chapter-title');
    const editorBody = document.getElementById('editor-body');
    const footer = document.getElementById('footer-bar');

    window.onload = () => {
        const data = localStorage.getItem('TOSS_WRITER_V5');
        if (data) state = JSON.parse(data);
        if (!state.activeId) state.activeId = state.chapters[0].id;
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        renderNav();
        loadChapter();
        lucide.createIcons();
        
        // [핵심] 선택 영역이 바뀔 때마다 위치를 저장함
        document.onselectionchange = () => {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                // 에디터 안에서 선택했을 때만 저장
                if (editorBody.contains(range.commonAncestorContainer)) {
                    savedRange = range.cloneRange();
                }
            }
        };

        initKeyboard();
    };

    function initKeyboard() {
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const offset = window.innerHeight - window.visualViewport.height;
                footer.style.bottom = offset > 50 ? offset + 'px' : '0px';
            });
        }
    }

    // 챕터 로직
    function renderNav() {
        const nav = document.getElementById('nav-list');
        nav.innerHTML = '';
        state.chapters.forEach(ch => {
            const tab = document.createElement('div');
            tab.className = `chapter-tab ${ch.id === state.activeId ? 'active' : ''}`;
            tab.innerText = ch.title || '제목 없음';
            tab.onclick = () => { saveData(); state.activeId = ch.id; loadChapter(); renderNav(); };
            nav.appendChild(tab);
        });
        const add = document.createElement('div');
        add.className = 'chapter-tab';
        add.innerText = '+ 추가';
        add.onclick = () => {
            saveData();
            const id = Date.now();
            state.chapters.push({ id: id, title: "새로운 장", content: "" });
            state.activeId = id;
            loadChapter(); renderNav();
        };
        nav.appendChild(add);
    }

    function loadChapter() {
        const ch = state.chapters.find(c => c.id === state.activeId);
        titleInput.value = ch.title;
        editorBody.innerHTML = ch.content;
    }

    function saveData() {
        if (isPreview) return;
        const ch = state.chapters.find(c => c.id === state.activeId);
        if (ch) {
            ch.title = titleInput.value;
            ch.content = editorBody.innerHTML;
        }
        localStorage.setItem('TOSS_WRITER_V5', JSON.stringify(state));
        const activeTab = document.querySelector('.chapter-tab.active');
        if (activeTab) activeTab.innerText = titleInput.value || '제목 없음';
    }

    function deleteChapter() {
        if (state.chapters.length <= 1) return;
        if (!confirm("삭제할까요?")) return;
        state.chapters = state.chapters.filter(c => c.id !== state.activeId);
        state.activeId = state.chapters[0].id;
        loadChapter(); renderNav();
    }

    /* [최종 해결책] PX 글꼴 크기 변경 함수 */
    function applyFontSize(size) {
        if (!savedRange) return;

        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange); // 보존된 영역 복구

        // 서식 적용
        document.execCommand('fontSize', false, '7');
        const fonts = editorBody.querySelectorAll('font[size="7"]');
        fonts.forEach(f => {
            f.removeAttribute('size');
            f.style.fontSize = size;
            f.style.lineHeight = "1.4";
            // 태그 정제
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.innerHTML = f.innerHTML;
            f.parentNode.replaceChild(span, f);
        });
        
        saveData();
        // 적용 후 다시 저장하여 연속 작업 가능케 함
        const newRange = document.createRange();
        newRange.selectNodeContents(editorBody); // 대략적 위치 유지
        savedRange = sel.getRangeAt(0);
    }

    function doExec(cmd) {
        if (!savedRange) return;
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
        document.execCommand(cmd, false, null);
        saveData();
    }

    function insertCode() {
        const lang = prompt("언어 (js, python, html)", "javascript") || "javascript";
        const html = `<div class="code-block-item" data-lang="${lang}" contenteditable="true"># ${lang} 코드를 입력하세요</div><p><br></p>`;
        editorBody.focus();
        document.execCommand('insertHTML', false, html);
        saveData();
    }

    function togglePreview() {
        isPreview = !isPreview;
        const btn = document.getElementById('preview-toggle');
        if (isPreview) {
            saveData();
            document.body.classList.add('preview-active');
            btn.classList.add('active');
            editorBody.querySelectorAll('.code-block-item').forEach(el => {
                const pre = document.createElement('pre');
                pre.className = `language-${el.dataset.lang}`;
                const code = document.createElement('code');
                code.textContent = el.innerText;
                pre.appendChild(code);
                el.innerHTML = ""; el.appendChild(pre);
            });
            Prism.highlightAllUnder(editorBody);
        } else {
            document.body.classList.remove('preview-active');
            btn.classList.remove('active');
            loadChapter();
        }
    }

    function openImgModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
    function closeImgModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    async function searchImages() {
        const q = document.getElementById('img-query').value || 'nature';
        const grid = document.getElementById('img-results');
        grid.innerHTML = '찾는 중...';
        let html = '';
        for (let i = 0; i < 6; i++) {
            const url = `https://loremflickr.com/600/600/${encodeURIComponent(q)}?lock=${i + Math.random()}`;
            html += `<img src="${url}" onclick="insertImg('${url}')">`;
        }
        grid.innerHTML = html;
    }

    function insertImg(url) {
        editorBody.focus();
        document.execCommand('insertHTML', false, `<img src="${url}" style="width:100%; border-radius:12px; margin:15px 0;"><br>`);
        closeImgModal(); saveData();
    }

    function toggleDark() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    function exportFile() {
        let text = "";
        state.chapters.forEach(ch => {
            const t = document.createElement('div'); t.innerHTML = ch.content;
            text += `[${ch.title}]\n${t.innerText}\n\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a.download = 'book.txt'; a.click();
    }
</script>
</body>
</html>
