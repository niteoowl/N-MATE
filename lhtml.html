<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 웹 에디터 & WowView</title>
    <!-- 안정성이 높은 CDN 배포처를 사용합니다 -->
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.7/src-min-noconflict/ace.min.js"></script>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* 상단 및 하단 여백 추가 (모바일 상/하단 바 및 노치 대응) */
            padding-top: env(safe-area-inset-top, 8px);
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }

        /* 상단 헤더 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            background-color: #2d2d2d;
            padding: 0 10px;
            border-bottom: 1px solid #3d3d3d;
            z-index: 1001;
            flex-shrink: 0;
        }
        .header-left, .header-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
        }
        .btn:active {
            background-color: #555;
        }
        .btn-learn {
            background-color: #4285f4;
        }
        .btn-learn:active {
            background-color: #357ae8;
        }

        /* 메인 레이아웃 구역 */
        .main-layout {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 에디터 컨테이너 */
        #editor-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #editor {
            width: 100%;
            height: 100%;
            font-size: 14px;
        }

        /* 미리보기 컨테이너 (기본: 좌측 서랍식 슬라이드) */
        #preview-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 85%;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 5px 0 15px rgba(0,0,0,0.4);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        #preview-container.open {
            transform: translateX(0);
        }

        /* 미리보기 전체화면 스타일 (상/하단 여백 및 모바일 safe-area 반영) */
        #preview-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            transform: translateX(0) !important;
            z-index: 2000 !important;
            background-color: #1e1e1e; /* 노치 및 하단 스피커/제스처 바 영역 어두운 테마 */
            padding-top: env(safe-area-inset-top, 12px);
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        .preview-header {
            background-color: #f1f1f1;
            color: #333;
            padding: 4px 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            height: 44px;
            flex-shrink: 0;
        }
        .preview-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .preview-btn-action {
            background: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
        }
        .preview-btn-action:active, .preview-btn-action.active {
            background-color: #4285f4;
            color: #fff;
            border-color: #357ae8;
        }
        
        /* 닫기 (X) 버튼 터치 영역 및 크기 대폭 확대 */
        .preview-close-btn, .archive-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
            line-height: 1;
            min-width: 40px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .preview-close-btn:active {
            background-color: rgba(0,0,0,0.1);
            color: #000;
        }

        #preview-iframe-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            background-color: #fff;
            min-height: 0;
        }
        #preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 내장 콘솔 창 스타일 */
        #preview-console {
            height: 160px;
            background-color: #181818;
            border-top: 2px solid #333;
            display: none; /* 기본 비활성화 (OFF) */
            flex-direction: column;
            font-family: monospace;
            font-size: 12px;
            flex-shrink: 0;
        }
        #preview-console.active {
            display: flex; /* 콘솔 ON 시 표시 */
        }
        .console-header {
            background-color: #252526;
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            color: #aaa;
            font-size: 11px;
        }
        .console-clear-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 11px;
        }
        .console-clear-btn:hover {
            color: #fff;
        }
        #console-body {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .console-log {
            color: #ddd;
            word-break: break-all;
            white-space: pre-wrap;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 2px;
        }
        .console-log.error { color: #ff6b6b; }
        .console-log.warn { color: #fcca46; }
        .console-log.info { color: #4ea8de; }

        /* 우측 학습 서랍 컨테이너 */
        #archive-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 85%;
            height: 100%;
            background-color: #252526;
            box-shadow: -5px 0 15px rgba(0,0,0,0.4);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        #archive-container.open {
            transform: translateX(0);
        }
        .archive-header {
            background-color: #2d2d2d;
            color: #fff;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3d3d;
            height: 44px;
        }
        .archive-close-btn {
            color: #aaa;
        }
        .archive-close-btn:active {
            background-color: rgba(255,255,255,0.15);
            color: #fff;
        }
        .archive-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .save-box {
            margin-bottom: 20px;
            background: #333;
            padding: 12px;
            border-radius: 8px;
        }
        .save-box label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .save-input-group {
            display: flex;
            gap: 8px;
        }
        #save-name {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .btn-save {
            background-color: #28a745 !important;
        }
        .btn-save:active {
            background-color: #218838 !important;
        }
        .list-box h3 {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
            border-left: 3px solid #4285f4;
            padding-left: 8px;
        }
        #saved-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .saved-item {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3d3d3d;
        }
        .saved-info {
            flex: 1;
            margin-right: 10px;
        }
        .saved-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            word-break: break-all;
        }
        .saved-date {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }
        .saved-actions {
            display: flex;
            gap: 6px;
        }
        .btn-action {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-load {
            background-color: #4285f4;
            color: white;
        }
        .btn-del {
            background-color: #dc3545;
            color: white;
        }
        .empty-list {
            text-align: center;
            color: #777;
            font-size: 13px;
            padding: 20px 0;
        }

        /* 서랍용 공통 배경 어둡게 처리 */
        .drawer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .drawer-overlay.active {
            display: block;
        }

        /* 상하 분할 모드 활성화 시 스타일 변경 */
        .main-layout.split-mode #editor-container {
            height: 50%;
        }
        .main-layout.split-mode #preview-container {
            position: static;
            width: 100%;
            height: 50%;
            transform: none;
            box-shadow: none;
            border-top: 3px solid #3d3d3d;
            transition: none;
            z-index: 1;
        }
        .main-layout.split-mode .preview-header {
            display: flex;
        }

        /* --- [추가] WowView 전용 스타일 --- */
        #wowview-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            z-index: 1500;
            display: none; /* 기본 숨김 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #wowview-container.active { display: flex; }
        .wv-input-group {
            width: 90%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 10;
        }
        .wv-input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
        }
        .wv-btn {
            padding: 10px 20px;
            background: #ff0000;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #wv-video-stage {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            display: none;
        }
        #wv-video-stage iframe { width: 100%; height: 100%; border: none; }
        #wv-exit-btn {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 15px;
            border: 1px solid #fff;
            border-radius: 4px;
        }
        /* 세로 모드에서 가로 회전 */
        @media screen and (orientation: portrait) {
            .theater-mode #wv-video-stage {
                position: fixed;
                top: 50%;
                left: 50%;
                width: 100vh;
                height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
                max-width: none;
                z-index: 9999;
                display: block;
            }
            .wv-input-group, #wv-exit-btn { z-index: 10001; }
        }
        .theater-mode #wv-exit-btn { display: block; }
    </style>
</head>
<body>

    <!-- 상단 바 -->
    <header>
        <div class="header-left">
            <button id="btn-open-drawer" class="btn">☰ 실행</button>
        </div>
        <div class="header-right">
            <button id="btn-wowview-open" class="btn" style="background-color: #ff0000;">📺 WowView</button>
            <button id="btn-toggle-split" class="btn">⇅ 분할</button>
            <button id="btn-open-archive" class="btn">📁 서랍</button>
            <a href="https://gemini.google.com" target="_blank" class="btn btn-learn">🎓 배우기</a>
        </div>
    </header>

    <!-- 에디터 및 미리보기 메인 영역 -->
    <div class="main-layout" id="main-layout">
        <div class="drawer-overlay" id="drawer-overlay"></div>

        <!-- 에디터 영역 -->
        <div id="editor-container">
            <div id="editor"></div>
        </div>

        <!-- [추가] WowView 컨테이너 -->
        <div id="wowview-container">
            <div class="wv-input-group" id="wv-controls">
                <input type="text" id="wv-video-url" class="wv-input" placeholder="유튜브 링크를 붙여넣으세요">
                <button class="wv-btn" onclick="loadWVVideo()">감상하기</button>
                <button class="wv-btn" style="background:#444;" onclick="closeWowView()">닫기</button>
            </div>
            <div id="wv-video-stage">
                <div id="wv-player"></div>
            </div>
            <button id="wv-exit-btn" onclick="exitWVTheater()">돌아가기</button>
        </div>

        <!-- 미리보기 영역 (좌측 서랍) -->
        <div id="preview-container">
            <div class="preview-header">
                <span>미리보기</span>
                <div class="preview-header-actions">
                    <button class="preview-btn-action" id="btn-refresh-preview" title="새로고침">🔄</button>
                    <button class="preview-btn-action" id="btn-toggle-console">📟 콘솔 OFF</button>
                    <button class="preview-btn-action" id="btn-fullscreen-preview" title="전체화면">&lt;&gt;</button>
                    <button class="preview-close-btn" id="btn-close-preview">&times;</button>
                </div>
            </div>
            
            <div id="preview-iframe-wrapper">
                <iframe id="preview-iframe" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
            </div>
            
            <div id="preview-console">
                <div class="console-header">
                    <span>📟 JS Console Output</span>
                    <button id="btn-clear-console" class="console-clear-btn">🧹 Clear</button>
                </div>
                <div id="console-body"></div>
            </div>
        </div>

        <!-- 학습 서랍 영역 (우측 서랍) -->
        <div id="archive-container">
            <div class="archive-header">
                <span>📁 학습 서랍</span>
                <button class="archive-close-btn" id="btn-close-archive">&times;</button>
            </div>
            <div class="archive-body">
                <div class="save-box">
                    <label for="save-name">현재 코드 저장하기</label>
                    <div class="save-input-group">
                        <input type="text" id="save-name" placeholder="예: 구구단 앱, 1일차 과제">
                        <button id="btn-save-code" class="btn btn-save">저장</button>
                    </div>
                </div>
                <div class="list-box">
                    <h3>저장된 학습 코드</h3>
                    <div id="saved-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultCode = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px 15px; background: #f7f9fc; color: #333; }
    h1 { color: #4285f4; font-size: 24px; }
    p { font-size: 15px; line-height: 1.6; color: #666; }
    button { padding: 12px 24px; font-size: 15px; background: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>안녕, 웹 코딩! 👋</h1>
  <p>이곳은 모바일 에디터입니다.</p>
  <button onclick="greet()">버튼을 눌러보세요</button>
  <script>
    console.log("🚀 페이지가 로드되었습니다.");
    function greet() { alert('반가워요!'); console.log('💡 클릭:', new Date().toLocaleTimeString()); }
  <\/script>
</body>
</html>`;

        const mainLayout = document.getElementById('main-layout');
        const btnOpenDrawer = document.getElementById('btn-open-drawer');
        const btnClosePreview = document.getElementById('btn-close-preview');
        const btnFullscreenPreview = document.getElementById('btn-fullscreen-preview');
        const btnRefreshPreview = document.getElementById('btn-refresh-preview');
        const btnToggleSplit = document.getElementById('btn-toggle-split');
        const previewContainer = document.getElementById('preview-container');
        const drawerOverlay = document.getElementById('drawer-overlay');
        const iframeWrapper = document.getElementById('preview-iframe-wrapper');
        const btnOpenArchive = document.getElementById('btn-open-archive');
        const btnCloseArchive = document.getElementById('btn-close-archive');
        const archiveContainer = document.getElementById('archive-container');
        const btnToggleConsole = document.getElementById('btn-toggle-console');
        const previewConsole = document.getElementById('preview-console');
        const consoleBody = document.getElementById('console-body');
        const btnClearConsole = document.getElementById('btn-clear-console');

        let isSplitMode = false;
        let isConsoleOpen = false;

        btnToggleConsole.addEventListener('click', () => {
            isConsoleOpen = !isConsoleOpen;
            if (isConsoleOpen) {
                previewConsole.classList.add('active');
                btnToggleConsole.classList.add('active');
                btnToggleConsole.textContent = '📟 콘솔 ON';
            } else {
                previewConsole.classList.remove('active');
                btnToggleConsole.classList.remove('active');
                btnToggleConsole.textContent = '📟 콘솔 OFF';
            }
        });

        btnClearConsole.addEventListener('click', () => { consoleBody.innerHTML = ''; });
        btnRefreshPreview.addEventListener('click', () => { updatePreview(); });

        btnOpenDrawer.addEventListener('click', () => {
            if (!isSplitMode) {
                previewContainer.classList.add('open');
                archiveContainer.classList.remove('open');
                drawerOverlay.classList.add('active');
            }
        });

        btnFullscreenPreview.addEventListener('click', () => {
            previewContainer.classList.toggle('fullscreen');
            btnFullscreenPreview.textContent = previewContainer.classList.contains('fullscreen') ? '><' : '<>';
        });

        btnOpenArchive.addEventListener('click', () => {
            archiveContainer.classList.add('open');
            previewContainer.classList.remove('open');
            previewContainer.classList.remove('fullscreen');
            drawerOverlay.classList.add('active');
            renderSavedList();
        });

        function closeAllDrawers() {
            previewContainer.classList.remove('open');
            previewContainer.classList.remove('fullscreen');
            archiveContainer.classList.remove('open');
            drawerOverlay.classList.remove('active');
        }

        btnClosePreview.addEventListener('click', closeAllDrawers);
        btnCloseArchive.addEventListener('click', closeAllDrawers);
        drawerOverlay.addEventListener('click', closeAllDrawers);

        btnToggleSplit.addEventListener('click', () => {
            isSplitMode = !isSplitMode;
            if (isSplitMode) {
                mainLayout.classList.add('split-mode');
                btnToggleSplit.textContent = '🗂️ 서랍';
                btnOpenDrawer.style.visibility = 'hidden';
                closeAllDrawers();
            } else {
                mainLayout.classList.remove('split-mode');
                btnToggleSplit.textContent = '⇅ 분할';
                btnOpenDrawer.style.visibility = 'visible';
            }
            if (!useFallback && editorInstance) { setTimeout(() => editorInstance.resize(), 100); }
        });

        let editorInstance = null;
        let useFallback = false;
        if (typeof ace !== 'undefined') {
            try {
                ace.config.set('basePath', 'https://cdn.jsdelivr.net/npm/ace-builds@1.32.7/src-min-noconflict/');
                editorInstance = ace.edit("editor");
                editorInstance.setTheme("ace/theme/monokai");
                editorInstance.session.setMode("ace/mode/html");
                editorInstance.setOptions({ fontSize: "14px", showPrintMargin: false, wrap: true, indentedSoftWrap: false, behavioursEnabled: true, autoScrollEditorIntoView: true, scrollPastEnd: 0.8 });
            } catch (e) { useFallback = true; }
        } else { useFallback = true; }

        if (useFallback) {
            const editorDiv = document.getElementById('editor');
            editorDiv.innerHTML = `<textarea id="textarea-editor" style="width:100%; height:100%; background:#1e1e1e; color:#fff; font-family:monospace; font-size:16px; border:none; padding:12px; resize:none; outline:none;"></textarea>`;
        }

        function getCodeValue() { return useFallback ? document.getElementById('textarea-editor').value : editorInstance.getValue(); }
        function setCodeValue(val) { if (useFallback) { document.getElementById('textarea-editor').value = val; } else { editorInstance.setValue(val, -1); } }

        const consoleInterceptorScript = `
        <script>
        (function() {
            function sendToParent(type, args) {
                try {
                    var messages = Array.from(args).map(function(arg) {
                        if (typeof arg === 'object') { try { return JSON.stringify(arg, null, 2); } catch(e) { return String(arg); } }
                        return String(arg);
                    });
                    window.parent.postMessage({ type: 'CONSOLE_LOG', logType: type, message: messages.join(' ') }, '*');
                } catch(e) {}
            }
            var _log = console.log, _error = console.error, _warn = console.warn, _info = console.info;
            console.log = function() { _log.apply(console, arguments); sendToParent('log', arguments); };
            console.error = function() { _error.apply(console, arguments); sendToParent('error', arguments); };
            console.warn = function() { _warn.apply(console, arguments); sendToParent('warn', arguments); };
            console.info = function() { _info.apply(console, arguments); sendToParent('info', arguments); };
            window.onerror = function(msg, url, line) { sendToParent('error', ['[Error] ' + msg + ' (Line: ' + line + ')']); };
        })();
        <\/script>`;

        window.addEventListener('message', (event) => {
            const currentIframe = document.getElementById('preview-iframe');
            if (!currentIframe || event.source !== currentIframe.contentWindow) return;
            if (event.data && event.data.type === 'CONSOLE_LOG') {
                const logItem = document.createElement('div');
                logItem.className = `console-log ${event.data.logType}`;
                logItem.textContent = event.data.message;
                consoleBody.appendChild(logItem);
                consoleBody.scrollTop = consoleBody.scrollHeight;
            }
        });

        function updatePreview() {
            const code = getCodeValue();
            localStorage.setItem('mobile_code_data_v2', code);
            const injectedCode = consoleInterceptorScript + code;
            consoleBody.innerHTML = '';
            iframeWrapper.innerHTML = '';
            const newIframe = document.createElement('iframe');
            newIframe.id = 'preview-iframe';
            newIframe.setAttribute('sandbox', 'allow-scripts allow-modals allow-same-origin');
            iframeWrapper.appendChild(newIframe);
            try {
                const iframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(injectedCode);
                iframeDoc.close();
            } catch (err) { console.error(err); }
        }

        let updateTimer = null;
        function debouncedUpdatePreview() { clearTimeout(updateTimer); updateTimer = setTimeout(updatePreview, 600); }
        if (useFallback) { document.getElementById('textarea-editor').addEventListener('input', debouncedUpdatePreview); }
        else { editorInstance.on("change", debouncedUpdatePreview); }

        const savedCode = localStorage.getItem('mobile_code_data_v2');
        setCodeValue(savedCode || defaultCode);
        updatePreview();

        // 학습 서랍 로직
        const saveNameInput = document.getElementById('save-name');
        const btnSaveCode = document.getElementById('btn-save-code');
        const savedListContainer = document.getElementById('saved-list');
        function getSavedCodes() { const raw = localStorage.getItem('mobile_editor_saved_list'); return raw ? JSON.parse(raw) : []; }
        function saveSavedCodes(arr) { localStorage.setItem('mobile_editor_saved_list', JSON.stringify(arr)); }

        btnSaveCode.addEventListener('click', () => {
            const name = saveNameInput.value.trim();
            if (!name) return alert('이름을 입력하세요.');
            const savedList = getSavedCodes();
            savedList.unshift({ id: Date.now(), name, code: getCodeValue(), date: new Date().toLocaleString() });
            saveSavedCodes(savedList);
            saveNameInput.value = '';
            renderSavedList();
        });

        function renderSavedList() {
            const savedList = getSavedCodes();
            savedListContainer.innerHTML = savedList.length ? '' : '<div class="empty-list">저장된 코드가 없습니다.</div>';
            savedList.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'saved-item';
                itemEl.innerHTML = `<div class="saved-info"><div class="saved-title">${item.name}</div></div>
                    <div class="saved-actions">
                        <button class="btn-action btn-load" onclick="loadSavedCode(${item.id})">불러오기</button>
                        <button class="btn-action btn-del" onclick="deleteSavedCode(${item.id})">삭제</button>
                    </div>`;
                savedListContainer.appendChild(itemEl);
            });
        }

        window.loadSavedCode = (id) => {
            const target = getSavedCodes().find(i => i.id === id);
            if (target && confirm('코드를 불러올까요?')) { setCodeValue(target.code); updatePreview(); closeAllDrawers(); }
        };
        window.deleteSavedCode = (id) => {
            let list = getSavedCodes();
            if (confirm('삭제할까요?')) { saveSavedCodes(list.filter(i => i.id !== id)); renderSavedList(); }
        };

        // --- [추가] WowView 비즈니스 로직 ---
        const wvContainer = document.getElementById('wowview-container');
        document.getElementById('btn-wowview-open').addEventListener('click', () => {
            wvContainer.classList.add('active');
        });
        function closeWowView() {
            wvContainer.classList.remove('active');
            exitWVTheater();
        }
        function extractWVID(url) {
            const reg = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(reg);
            return (match && match[7].length == 11) ? match[7] : false;
        }
        function loadWVVideo() {
            const val = document.getElementById('wv-video-url').value;
            const vid = extractWVID(val);
            if (vid) {
                document.getElementById('wv-player').innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay; fullscreen"></iframe>`;
                document.getElementById('wv-video-stage').style.display = 'block';
                document.body.classList.add('theater-mode');
            } else { alert('올바른 주소를 입력하세요.'); }
        }
        function exitWVTheater() {
            document.body.classList.remove('theater-mode');
            document.getElementById('wv-video-stage').style.display = 'none';
            document.getElementById('wv-player').innerHTML = '';
        }
    </script>
</body>
</html>
